<style>
:root{--ink:#1a1d29;--gold:#a3822f;--gold-soft:#f6efdd;--paper:#faf8f3;--surface:#fff;
  --line:#e7e1d4;--muted:#5c6270;--faint:#6b7280;--present:#256e46;--present-bg:#e6f3ec;
  --late:#8a6215;--late-bg:#fbf2df;--absent:#a4331f;--absent-bg:#f8e7e7;
  --leave:#3d52a8;--leave-bg:#e7eef8;--ferie:#0d6a6a;--ferie-bg:#e2f2f2;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;
  line-height:1.5;padding-bottom:48px}
.wrap{max-width:600px;margin:0 auto;padding:0 16px}
header{background:var(--ink);color:#fff;padding:22px 0 26px;border-bottom:3px solid var(--gold);
  padding-top:calc(22px + env(safe-area-inset-top))}
.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#d9bd74;font-weight:700}
.brand{font-size:21px;font-weight:700;margin-top:3px}
.sub{font-size:12.5px;color:#c7cad3;margin-top:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px;
  box-shadow:0 1px 2px rgba(26,29,41,.04)}
h2{font-size:13.5px;letter-spacing:.02em;margin:0 0 12px;color:var(--ink)}
.pin-in{width:100%;font-size:28px;letter-spacing:10px;text-align:center;padding:14px;border:1.5px solid var(--line);
  border-radius:13px;outline:none;font-weight:700;color:var(--ink)}
.pin-in:focus{border-color:var(--gold)}
.btn{display:block;width:100%;background:var(--gold);color:#fff;border:none;border-radius:13px;padding:15px;
  font-size:15px;font-weight:700;margin-top:14px;cursor:pointer;min-height:50px}
.btn:active{opacity:.9}
.btn[disabled]{opacity:.55}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:600}
.who{display:flex;align-items:center;gap:13px}
.av{width:48px;height:48px;border-radius:50%;background:var(--gold-soft);color:var(--gold);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex-shrink:0}
.who .nm{font-size:17px;font-weight:700}
.who .ct{font-size:12.5px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:14px}
.kpi{border:1px solid var(--line);border-radius:13px;padding:13px 14px;background:var(--surface)}
.kpi .v{font-size:23px;font-weight:700;line-height:1}
.kpi .l{font-size:11.5px;color:var(--muted);margin-top:5px}
.kpi.good .v{color:var(--present)} .kpi.warn .v{color:var(--late)} .kpi.bad .v{color:var(--absent)}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
th{text-align:left;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);
  padding:8px 5px;border-bottom:1px solid var(--line)}
td{padding:9px 5px;border-bottom:1px solid #f1ece1}
tr.f td{background:#f4faf9}
.mono{font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px}
.t-present{background:var(--present-bg);color:var(--present)}
.t-late{background:var(--late-bg);color:var(--late)}
.t-absent{background:var(--absent-bg);color:var(--absent)}
.t-leave{background:var(--leave-bg);color:var(--leave)}
.t-ferie{background:var(--ferie-bg);color:var(--ferie)}
.t-neutral{background:#eae5d9;color:var(--muted)}
.muted{color:var(--muted)} .center{text-align:center}
.err{background:var(--absent-bg);color:var(--absent);border-radius:11px;padding:12px 14px;font-size:13px;margin-top:12px}
.ok{background:var(--present-bg);color:var(--present);border-radius:11px;padding:12px 14px;font-size:13px;margin-top:12px}
.note{font-size:11.5px;color:var(--faint);margin-top:10px}
textarea,select{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;font-size:15px;outline:none;font-family:inherit}
textarea:focus,select:focus{border-color:var(--gold)}
.foot{text-align:center;font-size:11px;color:var(--faint);margin-top:22px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:12px 18px;border-radius:11px;font-size:13.5px;opacity:0;transition:opacity .25s;z-index:9;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.seg{display:flex;gap:8px;margin-top:16px}
.seg button{flex:1;padding:12px 8px;border-radius:11px;border:1px solid var(--line);font-weight:700;
  font-size:13px;cursor:pointer;background:var(--surface);color:var(--ink);min-height:46px}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg button .b{display:inline-block;background:var(--absent);color:#fff;border-radius:20px;
  font-size:10.5px;padding:1px 6px;margin-left:5px;vertical-align:1px}
.note-item{border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:11px;background:var(--surface)}
.note-item.nouv{border-color:var(--gold);background:#fffdf6}
.note-item .t{font-weight:700;font-size:14.5px}
.note-item .m{font-size:11.5px;color:var(--faint);margin-top:2px}
.note-item .x{font-size:13.5px;margin-top:9px;white-space:pre-wrap}
.vote-opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:12px;
  padding:14px;margin-bottom:9px;font-size:14.5px;background:var(--surface);cursor:pointer;min-height:50px}
.vote-opt:active{border-color:var(--gold)}
.vote-opt.mien{border-color:var(--gold);background:var(--gold-soft);font-weight:700}
.bar{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--gold)}
.install{position:fixed;left:12px;right:12px;bottom:12px;background:var(--ink);color:#fff;border-radius:14px;
  padding:14px 16px;display:none;align-items:center;gap:12px;z-index:8;box-shadow:0 12px 30px -12px rgba(0,0,0,.5)}
.install.on{display:flex}
.install .t{flex:1;font-size:13px}
.install button{background:var(--gold);color:#fff;border:none;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
.install .c{background:none;color:#aeb4c6;padding:6px}
.offline{position:fixed;left:0;right:0;top:0;z-index:9;background:var(--absent);color:#fff;
  font-size:12.5px;font-weight:600;text-align:center;padding:7px 12px;display:none;
  padding-top:calc(7px + env(safe-area-inset-top))}
.offline.on{display:block}
.aide-ios{font-size:12.5px;color:var(--muted);margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

      case '/api/coms/vote/delete': D.votes=D.votes.filter(v=>v.id!==corps.id); return ok();

      /* --- espace salarié --- */
      case '/api/me': {
        const e = D.employees[0];
        if(corps.pin && corps.pin!=='123456') return err('code', 401);
        if(!corps.pin) return Promise.resolve(new Response(JSON.stringify({need_pin:true}),
          {status:401, headers:{'Content-Type':'application/json'}}));
        const ym = (corps.mois&&corps.mois.length===7) ? corps.mois : TODAY.slice(0,7);
        const jours={}, cj={};
        for(const k in D.pointages){
          const r=D.pointages[k][e.id]; if(!r) continue;
          cj[k]=r; if(k.slice(0,7)===ym) jours[k]=r;
        }
        const mesNotes = D.notes.filter(n=>cibleOk(e,n.cible))
          .map(n=>({id:n.id,titre:n.titre,texte:n.texte,important:n.important,ts:n.ts,par:n.par,
                    lu:(n.lus||[]).indexOf(e.id)>=0})).reverse();
        const mesVotes = D.votes.filter(v=>cibleOk(e,v.cible)).map(v=>{
          const vote=(v.votants||[]).indexOf(e.id)>=0;
          return {id:v.id,question:v.question,options:v.options,ferme:!!v.ferme,vote:vote,
                  resultats:(vote||v.ferme)?v.resultats:null,monChoix:null};
        }).reverse();
        return ok({nom:e.nom, prenom:e.prenom, matricule:e.matricule, categorie:e.categorie,
                   sexe:e.sexe, mois:ym, today:TODAY, settings:D.settings, jours:jours,
                   notes:mesNotes, votes:mesVotes,
                   conges:{du:dec(-330), au:dec(35), auEffectif:TODAY, jours:cj}});
      }
      case '/api/me/lu': {
        const e=D.employees[0];
        D.notes.forEach(n=>{ if(n.id===corps.id && (n.lus||[]).indexOf(e.id)<0) n.lus.push(e.id) });
        return ok();
      }
      case '/api/me/vote': {
        const e=D.employees[0];
        const v=D.votes.filter(x=>x.id===corps.id)[0];
        if(!v) return err('Sondage introuvable',404);
        if(v.ferme) return err('Ce sondage est clos',409);
        if((v.votants||[]).indexOf(e.id)>=0) return err('Vous avez déjà répondu',409);
        v.resultats[corps.choix]=(v.resultats[corps.choix]||0)+1;
        v.votants.push(e.id);
        return ok({ok:true, resultats:v.resultats});
      }
      case '/api/me/flag': return ok();

      /* --- fonctions qui exigent réellement le serveur --- */
      case '/api/report/pdf':
        return err("Les PDF sont produits par le serveur : indisponibles dans cette démonstration hors ligne. Les exports CSV, eux, fonctionnent.", 503);
      case '/api/ai': case '/api/ocr':
        return err("L’assistant IA et la lecture de documents passent par le serveur : indisponibles dans cette démonstration.", 503);
      case '/api/import-mdb':
        return err("La lecture d’un fichier .mdb est faite par le serveur : indisponible dans cette démonstration. L’import CSV, lui, fonctionne.", 503);
      case '/api/pointeuse':
        if(m==='POST'){ Object.assign(D.pointeuse, corps||{}); return ok({ok:true, reglages:D.pointeuse}) }
        return ok({reglages:D.pointeuse, etat:D.ptzEtat,
          silence_h:2.4, muet:false, lecture_directe_possible:false, pyzk:false,
          mdb_path:'', sync:{}, url_publique:'https://demonstration.exemple',
          peut_modifier:true, compte_agent_existe:true});
      case '/api/pointeuse/agent.txt':
        return err("Le fichier de lancement de l’agent est préparé par le serveur : indisponible dans cette démonstration.", 503);
      case '/api/employees/modele.xlsx':
      case '/api/employees/import-fiches':
        return err("Le classeur Excel des fiches est construit et relu par le serveur : indisponible dans cette démonstration hors ligne. Sur votre installation, le bouton télécharge un modèle prérempli avec vos fiches.", 503);
      case '/api/sync': return err("Aucune pointeuse joignable depuis cette démonstration.", 503);
      case '/api/logout': return ok();
      default:
        if(chemin.indexOf('/reset-acces')>0) return ok({ok:true, pin:'482913'});
        if(chemin.indexOf('/photo')>0) return err("L’envoi de photo passe par le serveur.", 503);
        return ok();
    }
  };
})();

<script>/* ============================================================================
   PilotRH — moteur de calcul partagé
   ============================================================================
   Ce fichier est chargé par l'interface RH (index.html) ET par l'espace salarié
   (moi.html). Il contient l'UNIQUE implémentation du calcul des heures, retards,
   heures supplémentaires, pauses et jours fériés.

   Avant, ce calcul était dupliqué dans les deux pages et les deux copies avaient
   déjà divergé : une ouvrière pouvait lire dans son espace un nombre d'heures
   différent de celui envoyé au comptable. Un seul fichier = plus de divergence.
   ============================================================================ */
(function (root) {
'use strict';

/* ---------------------------------------------------------------- utilitaires */
const pad = n => String(n).padStart(2, '0');
const isoOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
function toMin(t) {
  if (!t) return null;
  const m = String(t).match(/^(\d{1,2}):(\d{2})/);
  if (!m) return null;
  return (+m[1]) * 60 + (+m[2]);
}
function fromMin(m) {
  if (m == null || isNaN(m)) return '';
  m = Math.round(m);
  const j = Math.floor(m / 1440);            // dépassement de minuit conservé, pas replié
  const r = ((m % 1440) + 1440) % 1440;
  return pad(Math.floor(r / 60)) + ':' + pad(r % 60) + (j > 0 ? ' (+' + j + 'j)' : '');
}
const hDec = min => min / 60;
const fr2 = n => Number(n).toFixed(2).replace('.', ',');
function hLabel(min) {
  const neg = min < 0; min = Math.abs(min);
  const h = Math.floor(min / 60), m = Math.round(min % 60);
  return (neg ? '-' : '') + h + 'h' + (m ? pad(m) : '');
}
/* Échappement HTML — OBLIGATOIRE sur toute donnée venant du serveur, de la
   pointeuse (le nom d'une employée est un champ libre sur l'appareil) ou de l'IA. */
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
/* Échappement pour un attribut onclick="fn('…')" */
function escJs(s) { return String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/</g, '\\u003c'); }

/* ------------------------------------------------------- jours fériés (Tunisie) */
/* Fêtes à date fixe — s'appliquent chaque année. */
const FERIES_FIXES_DEFAUT = [
  { md: '01-01', nom: 'Nouvel An' },
  { md: '01-14', nom: 'Fête de la Révolution' },
  { md: '03-20', nom: "Fête de l'Indépendance" },
  { md: '04-09', nom: 'Jour des Martyrs' },
  { md: '05-01', nom: 'Fête du Travail' },
  { md: '07-25', nom: 'Fête de la République' },
  { md: '08-13', nom: 'Fête de la Femme' },
  { md: '10-15', nom: "Fête de l'Évacuation" },
];
/* Les fêtes religieuses (Aïd El Fitr, Aïd El Idha, Mouled, Ras El Am El Hejri)
   se déplacent chaque année : elles se saisissent dans les paramètres, dans
   settings.feries = [{date:'2026-03-20', nom:'…', jours:1}]. */

/* --------------------------------------------------- normalisation des réglages */
function normalizeSettings(s) {
  s = s || {};
  if (s.modeHS !== 'seuil') s.modeHS = 'fin';          // un seul défaut, plus de contradiction
  if (s.arrondi === undefined) s.arrondi = 0;
  if (s.arrondiSens === undefined) s.arrondiSens = 'proche';
  /* Arrondi appliqué À LA JOURNÉE, comme dans la version d'origine : chaque jour
     affiché est un nombre rond, et la somme des journées est exactement égale au
     total du mois. Une ouvrière peut donc additionner ses journées et retrouver le
     total de son bulletin — ce qui n'est plus vrai si l'on arrondit le cumul. */
  if (s.arrondiPortee !== 'periode') s.arrondiPortee = 'jour';
  if (s.congesDu === undefined) s.congesDu = '';
  if (s.congesAu === undefined) s.congesAu = '';
  if (s.congesCoef === undefined) s.congesCoef = 0;
  if (!Array.isArray(s.feries)) s.feries = [];
  if (!Array.isArray(s.feriesFixes) || !s.feriesFixes.length) s.feriesFixes = FERIES_FIXES_DEFAUT.map(f => ({ ...f }));
  if (s.feriesActifs === undefined) s.feriesActifs = true;
  if (!Array.isArray(s.clotures)) s.clotures = [];      // mois verrouillés : ['2026-06', …]
  /* Taux par défaut de la convention : servent de repli quand la fiche n'a pas
     de taux propre, pour ne pas ressaisir le même chiffre sur tout l'effectif. */
  if (s.tauxHoraireDefaut === undefined) s.tauxHoraireDefaut = 0;
  if (s.tauxJourDefaut === undefined) s.tauxJourDefaut = 0;

  const legacy = {
    debut: s.heureDebut || '07:30', fin: s.heureFin || '16:30',
    pause: (s.pause !== undefined ? s.pause : 30),
    tol: (s.toleranceRetard !== undefined ? s.toleranceRetard : 15),
    grace: (s.graceHS !== undefined ? s.graceHS : 15),
  };
  if (!s.jours) s.jours = {};
  for (let d = 0; d < 7; d++) s.jours[d] = normalizeDay(s.jours[d], d, legacy);

  if (!Array.isArray(s.periodes)) s.periodes = [];
  s.periodes.forEach(p => {
    if (!p.jours) {
      p.jours = {};
      const lv = p.lunven || { debut: '07:00', fin: '14:00', pause: 0 };
      const sa = p.samedi || { actif: false, debut: '07:00', fin: '13:00', pause: 0 };
      [1, 2, 3, 4, 5].forEach(d => p.jours[d] = { actif: true, debut: lv.debut, fin: lv.fin, pause: +lv.pause || 0, tol: p.tol || 15, grace: p.grace || 15 });
      p.jours[6] = sa.actif ? { actif: true, debut: sa.debut, fin: sa.fin, pause: +sa.pause || 0, tol: p.tol || 15, grace: p.grace || 15 }
                            : { actif: false };
      p.jours[0] = { actif: false };
    }
    for (let d = 0; d < 7; d++) p.jours[d] = normalizeDay(p.jours[d], d, { debut: '07:00', fin: '14:00', pause: 0, tol: 15, grace: 15 });
  });
  /* Une période sans dates valides ne doit jamais s'appliquer silencieusement. */
  s.periodes.forEach(p => { if (p.du && p.au && p.au < p.du) { const t = p.du; p.du = p.au; p.au = t; } });
  return s;
}
function normalizeDay(r, d, def) {
  r = r || {};
  const day = {
    actif: (r.actif === undefined ? (d !== 0) : !!r.actif),
    debut: r.debut || def.debut || '07:30',
    fin: r.fin || (d === 6 ? '13:00' : (def.fin || '16:30')),
    pause: (r.pause !== undefined ? +r.pause : (d === 6 ? 0 : (def.pause !== undefined ? +def.pause : 30))),
    tol: (r.tol !== undefined ? +r.tol : (def.tol !== undefined ? +def.tol : 15)),
    grace: (r.grace !== undefined ? +r.grace : (def.grace !== undefined ? +def.grace : 15)),
    pauseDe: r.pauseDe || '',
    pauseA: r.pauseA || '',
    pauseAuto: false,
  };
  /* Plage de pause : si elle n'est pas renseignée, on la déduit du milieu de la
     journée pour que la pause ne soit PLUS déduite d'une demi-journée ou d'une
     autorisation de sortie. La plage déduite est signalée dans l'interface pour
     que les RH saisissent la vraie plage (ex. 12:00 → 12:30). */
  if (day.pause > 0 && (!day.pauseDe || !day.pauseA)) {
    const a = toMin(day.debut), b = toMin(day.fin);
    if (a != null && b != null && b > a) {
      const mid = Math.round((a + b) / 2);
      day.pauseDe = fromMin(mid - day.pause / 2).slice(0, 5);
      day.pauseA = fromMin(mid + day.pause / 2).slice(0, 5);
      day.pauseAuto = true;
    }
  }
  return day;
}

/* ------------------------------------------------------------ régime d'un jour */
/* Les résultats sont mémoïsés : regimeFor était appelé des centaines de milliers
   de fois par rendu, en allouant un objet Date à chaque appel. */
function makeEngine(getSettings) {
  const cacheReg = new Map();
  const cacheFerie = new Map();
  let stamp = 0;

  function invalidate() { cacheReg.clear(); cacheFerie.clear(); stamp++; }

  function S() { return getSettings() || {}; }

  function regimeFor(ds) {
    if (cacheReg.has(ds)) return cacheReg.get(ds);
    const s = S();
    const w = new Date(ds + 'T12:00').getDay();
    let reg = null;
    if (s.periodes) {
      for (const p of s.periodes) {
        if (p.du && p.au && p.du <= ds && ds <= p.au) { reg = (p.jours || {})[w] || { actif: false }; break; }
      }
    }
    if (!reg) reg = (s.jours || {})[w] || { actif: true, debut: '07:30', fin: '16:30', pause: 30, tol: 15, grace: 15, pauseDe: '', pauseA: '' };
    cacheReg.set(ds, reg);
    return reg;
  }

  /* Renvoie {nom} si le jour est férié, sinon null. */
  function ferieFor(ds) {
    if (cacheFerie.has(ds)) return cacheFerie.get(ds);
    const s = S();
    let out = null;
    if (s.feriesActifs !== false) {
      const md = String(ds).slice(5);
      /* le drapeau `off` (bouton × des paramètres) était ignoré : une fête fixe
         désactivée continuait à être comptée comme jour férié */
      const fx = (s.feriesFixes || []).find(f => f.md === md && !f.off);
      if (fx) out = { nom: fx.nom, fixe: true };
      if (!out) {
        for (const f of (s.feries || [])) {
          if (!f.date) continue;
          const n = Math.max(1, +f.jours || 1);
          const d0 = new Date(f.date + 'T12:00');
          for (let k = 0; k < n; k++) {
            if (isoOf(d0) === ds) { out = { nom: f.nom || 'Jour férié', fixe: false }; break; }
            d0.setDate(d0.getDate() + 1);
          }
          if (out) break;
        }
      }
    }
    cacheFerie.set(ds, out);
    return out;
  }

  /* Un jour est-il « attendu au travail » ? Non si repos hebdomadaire OU férié. */
  function estOuvre(ds) {
    const reg = regimeFor(ds);
    if (reg.actif === false) return false;
    if (ferieFor(ds)) return false;
    return true;
  }

  const roundMin = (x, step, sens) => (!step || step <= 0) ? x : (sens === 'inferieur' ? Math.floor(x / step) * step : Math.round(x / step) * step);

  function badges(rec) {
    const P = (rec.punches && rec.punches.length) ? rec.punches.slice() : [rec.entree, rec.sortie];
    const out = [];
    P.map(toMin).filter(x => x != null).sort((a, b) => a - b).forEach(m => {
      /* déduplication : deux badges à moins de 5 min sont le même passage
         (double lecture du doigt), sinon la journée est coupée en deux à tort */
      if (out.length && m - out[out.length - 1] < 5) return;
      out.push(m);
    });
    return out;
  }

  /* Durée d'intersection entre une liste de segments et une fenêtre [a,b]. */
  function chevauchement(segs, a, b) {
    if (a == null || b == null || b <= a) return 0;
    let t = 0;
    for (const s of segs) { const x = Math.max(s[0], a), y = Math.min(s[1], b); if (y > x) t += y - x; }
    return t;
  }

  /* ------------------------------------------------------------------ metrics */
  /* Renvoie, pour un enregistrement de pointage :
       statut   : present | late | absent | leave | mission | autorisation | ferie | ferieTravaille | repos
       heures   : minutes normales payées
       hs       : minutes supplémentaires
       retard   : minutes de retard
       revue    : true si la journée doit être vérifiée par les RH avant la paie
       motifRevue : raison lisible
       manuel / manuelHS : la valeur a été saisie à la main
  */
  function metrics(rec, date) {
    const ds = date || isoOf(new Date());
    const reg = regimeFor(ds);
    const ferie = ferieFor(ds);
    const arrondiParJour = S().arrondiPortee === 'jour';
    const base = { statut: 'absent', worked: false, heures: 0, retard: 0, hs: 0, late: false,
                   manuel: false, manuelHS: false, coupures: false, revue: false, motifRevue: '',
                   ferie: !!ferie, ferieNom: ferie ? ferie.nom : '', ouvre: estOuvre(ds) };

    const P = rec ? badges(rec) : [];
    const aucunPointage = !P.length;

    /* Statuts sans pointage : le jour n'est PAS une absence s'il est férié ou de repos. */
    if (!rec || rec.statut === 'absent') {
      if (aucunPointage) {
        if (ferie) return { ...base, statut: 'ferie' };
        if (reg.actif === false) return { ...base, statut: 'repos' };
        return { ...base, statut: 'absent' };
      }
    }
    if (rec && ['leave', 'mission'].includes(rec.statut) && aucunPointage) {
      return { ...base, statut: rec.statut };
    }
    if (aucunPointage && rec && rec.statut !== 'present' && rec.statut !== 'autorisation') {
      return { ...base, statut: rec.statut || 'absent' };
    }

    let heures = 0, retard = 0, hs = 0, late = false, coupures = false, revue = false, motifRevue = '';

    if (P.length === 1) {
      /* Un seul badge : la sortie (ou l'entrée) manque. On ne paie PAS 0 h en
         silence — la journée est marquée à revoir et remonte dans les alertes.
         Le RETARD, lui, reste calculé : l'heure d'arrivée est connue, et la
         version précédente le comptait déjà. L'oublier ferait disparaître la
         moitié des retards du mois. */
      revue = true;
      motifRevue = 'Un seul badge (' + fromMin(P[0]) + ') — sortie manquante';
      if (reg.actif !== false && !ferie) {
        const debut1 = toMin(reg.debut), tol1 = +reg.tol || 0;
        if (debut1 != null) {
          late = P[0] > debut1 + tol1;
          retard = late ? (P[0] - debut1) : 0;
        }
      }
    } else if (P.length) {
      const firstIn = P[0], lastOut = P[P.length - 1];
      if (reg.actif === false || ferie) {
        /* Repos hebdomadaire ou jour férié travaillé : tout le temps de présence
           est en heures supplémentaires.
           On somme les SEGMENTS badgés au lieu de faire (dernier - premier) :
           l'ancien calcul comptait comme travaillée une sortie de deux heures au
           milieu de la journée, et retirait à l'inverse une pause théorique que
           personne n'avait prise. */
        if (P.length % 2 === 0) {
          for (let i = 0; i + 1 < P.length; i += 2) hs += P[i + 1] - P[i];
          coupures = P.length > 2;
        } else {
          hs = lastOut - firstIn;
          revue = true;
          motifRevue = 'Nombre de badges impair (' + P.length + ') un jour non ouvré';
        }
        hs = Math.max(0, hs);
      } else {
        const debut = toMin(reg.debut), fin = toMin(reg.fin);
        const grace = +reg.grace || 0, tol = +reg.tol || 0, pause = +reg.pause || 0;
        late = firstIn > debut + tol;
        retard = late ? (firstIn - debut) : 0;

        let segs = [];
        if (P.length % 2 === 0) { for (let i = 0; i + 1 < P.length; i += 2) segs.push([P[i], P[i + 1]]); coupures = P.length > 2; }
        else { segs = [[firstIn, lastOut]]; revue = true; motifRevue = 'Nombre de badges impair (' + P.length + ') — un pointage a été oublié'; }

        const clip = segs.map(s => [Math.max(s[0], debut), Math.min(s[1], fin)]).filter(s => s[1] > s[0]);
        let norm = clip.reduce((t, s) => t + (s[1] - s[0]), 0);

        /* Pause : déduite uniquement à hauteur du temps réellement travaillé
           PENDANT la plage de pause. Une autorisation 07:55 → 11:00 ne se voit
           donc plus retirer 30 minutes de déjeuner qu'elle n'a pas prises. */
        if (pause > 0) {
          const pa = toMin(reg.pauseDe), pb = toMin(reg.pauseA);
          if (pa != null && pb != null && pb > pa) norm -= Math.min(pause, chevauchement(clip, pa, pb));
          else {
            /* pas de plage définie : on retombe sur l'ancien calcul, mais au
               prorata du temps de présence pour ne pas surdéduire */
            let gaps = 0;
            for (let i = 0; i + 1 < clip.length; i++) { const g0 = clip[i][1], g1 = clip[i + 1][0]; if (g1 > g0) gaps += g1 - g0; }
            const attendu = Math.max(1, (fin - debut) - pause);
            norm -= Math.max(0, pause - gaps) * Math.min(1, norm / attendu);
          }
        }
        heures = Math.max(0, norm);
        if (lastOut >= fin + grace) hs = (S().modeHS === 'fin') ? (lastOut - fin) : (lastOut - (fin + grace));
        hs = Math.max(0, hs);
      }
    }

    /* Arrondi : par défaut sur le CUMUL de la période (voir arrondirTotal), pas
       par jour — l'arrondi journalier dérivait jusqu'à plusieurs heures par mois. */
    if (arrondiParJour) {
      const ar = +S().arrondi || 0;
      if (ar > 0) { heures = roundMin(heures, ar, S().arrondiSens); hs = roundMin(hs, ar, S().arrondiSens); }
    }

    /* Saisie manuelle. hM remplace les heures normales ; hsM remplace les heures
       supplémentaires. Si les RH saisissent hM sans saisir hsM, les heures sup.
       calculées sont mises à zéro : la saisie manuelle est considérée comme
       exhaustive, sinon on payait deux fois la même journée. */
    let manuel = false, manuelHS = false;
    if (rec && rec.hM != null && rec.hM !== '') { heures = +rec.hM; manuel = true; }
    if (rec && rec.hsM != null && rec.hsM !== '') { hs = +rec.hsM; manuelHS = true; }
    else if (manuel) hs = 0;

    let statut;
    if (ferie) statut = (heures || hs || P.length) ? 'ferieTravaille' : 'ferie';
    else if (reg.actif === false && P.length) statut = 'reposTravaille';
    else if (rec && rec.statut === 'present') statut = late ? 'late' : 'present';
    else statut = (rec && rec.statut) || 'absent';

    return { ...base, statut, worked: true, heures, retard, hs, late, manuel, manuelHS, coupures, revue, motifRevue };
  }

  /* Arrondi appliqué au TOTAL d'une période (comportement par défaut). */
  function arrondirTotal(min) {
    if (S().arrondiPortee === 'jour') return min;
    const ar = +S().arrondi || 0;
    return ar > 0 ? roundMin(min, ar, S().arrondiSens) : min;
  }

  function moisClos(ym) { return (S().clotures || []).indexOf(ym) >= 0; }

  /* ------------------------------------------------------------ rémunération */
  /* Le taux de la fiche l'emporte ; s'il est vide, on retombe sur le taux par
     défaut des paramètres (convention collective). Cela évite de saisir le même
     taux horaire sur les 97 fiches. */
  function taux(e) {
    const s = S(), m = modePaie(e);
    if (m === 'journalier') return +(e && e.tauxJour) || +s.tauxJourDefaut || 0;
    return +(e && e.tauxHoraire) || +s.tauxHoraireDefaut || 0;
  }
  /* Base de paie d'une personne sur une période, à partir d'une ligne de
     synthèse {jT,jFT,hN,hS}. Aucune majoration légale n'est appliquée ici :
     la quantité est celle qui est réellement constatée sur les pointages. */
  function paie(e, s) {
    s = s || {};
    const mode = modePaie(e), t = taux(e);
    const qte = (mode === 'journalier')
      ? ((+s.jT || 0) + (+s.jFT || 0))
      : hDec((+s.hN || 0) + (+s.hS || 0));
    return {
      mode: mode,
      unite: (mode === 'journalier') ? 'j' : 'h',
      uniteLong: (mode === 'journalier') ? 'jour(s) travaillé(s)' : 'heure(s) payée(s)',
      label: (mode === 'journalier') ? 'Journée' : 'Heure',
      qte: qte,
      taux: t,
      montant: t ? Math.round(qte * t * 1000) / 1000 : 0,
      tauxDefaut: !(mode === 'journalier' ? (e && +e.tauxJour) : (e && +e.tauxHoraire)),
    };
  }

  return { regimeFor, ferieFor, estOuvre, metrics, badges, roundMin, arrondirTotal, moisClos,
           taux, paie, invalidate, get stamp() { return stamp; } };
}

/* ------------------------------------------------------------------- libellés */
/* Libellés accordés au genre de la personne pour les lignes individuelles, et
   neutres pour les compteurs collectifs (l'effectif comporte des hommes). */
const STATUTS = {
  present:        { f: 'Présente',    h: 'Présent',    cls: 't-present' },
  late:           { f: 'En retard',   h: 'En retard',  cls: 't-late' },
  absent:         { f: 'Absente',     h: 'Absent',     cls: 't-absent' },
  leave:          { f: 'En congé',    h: 'En congé',   cls: 't-leave' },
  mission:        { f: 'En mission',  h: 'En mission', cls: 't-mission' },
  autorisation:   { f: 'Autorisation', h: 'Autorisation', cls: 't-leave' },
  ferie:          { f: 'Férié',       h: 'Férié',      cls: 't-ferie' },
  ferieTravaille: { f: 'Férié travaillé', h: 'Férié travaillé', cls: 't-mission' },
  repos:          { f: 'Repos',       h: 'Repos',      cls: 't-neutral' },
  reposTravaille: { f: 'Repos travaillé', h: 'Repos travaillé', cls: 't-mission' },
};
function statutLabel(st, sexe) {
  const s = STATUTS[st];
  if (!s) return st || '—';
  return (sexe === 'H') ? s.h : s.f;
}
function statutClass(st) { return (STATUTS[st] || { cls: 't-neutral' }).cls; }
/* Les statuts qui comptent comme une absence à justifier. */
const EST_ABSENCE = st => st === 'absent';

/* Une journée est protégée des imports dès qu'elle porte une trace de saisie
   manuelle. Doit rester le MIROIR EXACT de _est_protege() dans mdb_import.py :
   sinon l'interface affiche un cadenas là où le serveur n'en met pas, ou pire,
   n'en affiche pas là où la journée est réellement protégée. */
/* ------------------------------------------------------------- rémunération */
/* Deux modes seulement, volontairement : les ouvrières sont payées à l'heure
   (convention collective du textile) et les cadres à la journée travaillée.
   Si la fiche ne dit rien, on déduit le mode de la catégorie — c'est ce que
   faisait l'application avant que le mode devienne saisissable. */
const MODES_PAIE = ['horaire', 'journalier'];
const MODES_PAIE_LABEL = { horaire: 'À l’heure', journalier: 'À la journée' };
function modePaie(e) {
  if (e && MODES_PAIE.indexOf(e.modePaie) >= 0) return e.modePaie;
  return (e && e.categorie === 'Cadre') ? 'journalier' : 'horaire';
}

function estProtege(rec) {
  if (!rec) return false;
  if (rec.manuel) return true;
  if (rec.hM != null && rec.hM !== '') return true;
  if (rec.hsM != null && rec.hsM !== '') return true;
  if (rec.src === 'conge') return true;
  return false;
}

root.PilotRHCore = {
  pad, isoOf, toMin, fromMin, hDec, fr2, hLabel, esc, escJs,
  normalizeSettings, normalizeDay, makeEngine,
  FERIES_FIXES_DEFAUT, STATUTS, statutLabel, statutClass, EST_ABSENCE, estProtege,
  MODES_PAIE, MODES_PAIE_LABEL, modePaie,
};
})(typeof window !== 'undefined' ? window : this);
</script>
<script>
'use strict';
const C = window.PilotRHCore;
const { pad, isoOf, hLabel, fr2, hDec, esc } = C;
const params = new URLSearchParams(location.search);
const app = document.getElementById('app');

/* Le jeton était dans l'URL à chaque appel : il finissait dans les journaux du
   serveur et dans l'historique du téléphone. On le garde côté navigateur et on
   nettoie l'adresse dès la première ouverture. */
let TOKEN = 'DEMO';
try{
  if(TOKEN){ localStorage.setItem('pilotrh_t', TOKEN); history.replaceState(null,'','/moi'); }
  else { TOKEN = localStorage.getItem('pilotrh_t') || ''; }
}catch(e){}

let DATA=null, PIN='', ONGLET='pointage';
const JJ=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
/* premier / dernier badge quand entree-sortie ne sont pas renseignes */
const aff=(r,i)=>{if(!r)return '';const p=r.punches;
  if(i===0)return r.entree||(p&&p.length?p[0]:'');
  return r.sortie||(p&&p.length>1?p[p.length-1]:'')};
const fmtPer=iso=>{const p=String(iso||'').split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:(iso||'')};
const shiftYm=(ym,d)=>{const a=ym.split('-');let Y=+a[0],M=+a[1]+d;while(M<1){M+=12;Y--}while(M>12){M-=12;Y++}return Y+'-'+pad(M)};

const ENGINE = C.makeEngine(()=>(DATA?DATA.settings:{}));
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2600)}

/* Les messages techniques du serveur ne veulent rien dire pour une ouvrière :
   « non_connecte » s'affichait tel quel dans un bandeau. On les traduit. */
const MESSAGES = {
  non_connecte: 'Votre accès n’a pas été reconnu. Rescannez votre carte QR, ou demandez-en une nouvelle au service RH.',
  invalide: 'Votre accès n’a pas été reconnu. Rescannez votre carte QR.',
};
function lisible(err){
  const brut = String((err && err.message) || '');
  if (MESSAGES[brut]) return MESSAGES[brut];
  if (err && err.reseau) return 'Pas de réseau. Réessayez quand la connexion revient.';
  if (/^erreur 5\d\d$/.test(brut)) return 'Le serveur a rencontré un problème. Réessayez dans un instant.';
  if (brut === 'erreur 404') return 'Cette fonction n’est pas disponible sur ce serveur. Prévenez le service RH.';
  return brut || 'Action impossible pour le moment';
}

async function post(url,body){
  let r;
  try{
    r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(Object.assign({t:TOKEN},body||{}))});
  }catch(x){
    const e=new Error('Pas de réseau');e.reseau=true;throw e;
  }
  const txt=await r.text();
  let d=null;try{d=txt?JSON.parse(txt):null}catch(e){}
  if(!r.ok){const e=new Error((d&&d.error)||('erreur '+r.status));e.status=r.status;e.data=d;throw e}
  return d;
}
async function fetchMe(pin,mois){
  try{
    const d=await post('/api/me',{pin:pin||'',mois:mois||''});
    return {ok:true,data:d};
  }catch(e){
    return {ok:false,status:e.status,need_pin:e.data&&e.data.need_pin,error:e.message};
  }
}
async function loadMonth(ym){
  const res=await fetchMe(PIN,ym);
  if(res.ok){DATA=res.data;DATA.settings=C.normalizeSettings(DATA.settings);ENGINE.invalidate();render()}
  else toast('Impossible de charger ce mois');
}

/* --------------------------------------------------------------- écran du code */
function pinScreen(msg){
  app.innerHTML='<div class="card">'+
    '<h2>Code d’accès</h2>'+
    '<p class="muted" style="margin:0 0 14px;font-size:13.5px">Saisissez le code personnel remis avec votre QR code.</p>'+
    '<label for="pin" class="muted" style="font-size:12px">Votre code</label>'+
    '<input class="pin-in" id="pin" type="tel" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••">'+
    (msg?'<div class="err">'+esc(msg)+'</div>':'')+
    '<button class="btn" id="go">Voir mon pointage</button>'+
    '<div class="note">Vos informations sont strictement personnelles et confidentielles. '+
    'Ne communiquez votre code à personne.</div></div>';
  const inp=document.getElementById('pin');inp.focus();
  const btn=document.getElementById('go');
  const submit=async()=>{
    const v=inp.value.trim();
    if(v.length<4){toast('Au moins 4 chiffres');return}
    btn.disabled=true;btn.textContent='Vérification…';
    const res=await fetchMe(v);
    if(res.ok){PIN=v;DATA=res.data;DATA.settings=C.normalizeSettings(DATA.settings);ENGINE.invalidate();render()}
    else if(res.status===429)pinScreen('Trop de tentatives. Patientez quelques minutes.');
    else pinScreen('Code incorrect. Réessayez.');
  };
  btn.onclick=submit;
  inp.onkeydown=e=>{if(e.key==='Enter')submit()};
  inp.oninput=()=>{if(inp.value.length===6)submit()};
}

/* ------------------------------------------------------------------- synthèse */
function summary(){
  const j=DATA.jours, ym=DATA.mois, today=DATA.today;
  const a=ym.split('-'),Y=+a[0],M=+a[1];
  const dim=new Date(Y,M,0).getDate();
  let trav=0,abs=0,conge=0,retN=0,retMin=0,hN=0,hS=0,feries=0,revue=0;
  const lines=[];
  for(let d=1;d<=dim;d++){
    const ds=ym+'-'+pad(d);
    if(ds>today)break;
    const rec=j[ds];
    const m=ENGINE.metrics(rec,ds);
    if(!rec&&!ENGINE.estOuvre(ds))continue;      // repos / férié sans pointage : on n'affiche rien
    if(m.statut==='repos')continue;
    if(m.revue)revue++;
    switch(m.statut){
      case 'ferie': feries++;break;
      case 'absent': abs++;break;
      case 'leave': case 'mission': conge++;break;
      case 'ferieTravaille': case 'reposTravaille': hS+=m.hs;break;
      default: trav++;if(m.late){retN++;retMin+=m.retard}hN+=m.heures;hS+=m.hs;
    }
    lines.push({ds,d,m,rec:rec||{}});
  }
  hN=ENGINE.arrondirTotal(hN);hS=ENGINE.arrondirTotal(hS);
  let congeAn=0,hCumul=0;
  if(DATA.conges&&DATA.conges.jours){
    for(const ds in DATA.conges.jours){
      const m=ENGINE.metrics(DATA.conges.jours[ds],ds);
      if(m.statut==='leave')congeAn++;
      else if(m.worked)hCumul+=(m.heures+m.hs);
    }
  }
  hCumul=ENGINE.arrondirTotal(hCumul);
  const coef=+((DATA.settings||{}).congesCoef||0);
  return{trav,abs,conge,retN,retMin,hN,hS,lines,congeAn,hCumul,hDues:hCumul*coef,coef,feries,revue};
}

/* --------------------------------------------------------------------- rendu */
function render(){
  const nonLues=(DATA.notes||[]).filter(n=>!n.lu).length;
  const aVoter=(DATA.votes||[]).filter(v=>!v.vote&&!v.ferme).length;
  const ini=((DATA.prenom||' ')[0]||'')+((DATA.nom||' ')[0]||'');
  const ym=DATA.mois.split('-');const moisTxt=MOIS[+ym[1]-1]+' '+ym[0];
  app.innerHTML=
    '<div class="card"><div class="who"><div class="av">'+esc(ini.toUpperCase())+'</div>'+
      '<div><div class="nm">'+esc((DATA.prenom||'')+' '+(DATA.nom||''))+'</div>'+
      '<div class="ct">Matricule <b>'+esc(DATA.matricule)+'</b>'+(DATA.categorie?' · '+esc(DATA.categorie):'')+'</div></div></div></div>'+
    '<div class="seg">'+
      '<button class="'+(ONGLET==='pointage'?'on':'')+'" onclick="setOnglet(\'pointage\')">Mon pointage</button>'+
      '<button class="'+(ONGLET==='notes'?'on':'')+'" onclick="setOnglet(\'notes\')">Notes'+
        (nonLues?'<span class="b">'+nonLues+'</span>':'')+'</button>'+
      '<button class="'+(ONGLET==='votes'?'on':'')+'" onclick="setOnglet(\'votes\')">Sondages'+
        (aVoter?'<span class="b">'+aVoter+'</span>':'')+'</button>'+
    '</div>'+
    '<div id="tab"></div>'+
    '<div class="foot">PilotRH · Lassanis — espace salarié</div>';
  document.getElementById('tab').innerHTML=
    ONGLET==='pointage'?vuePointage(moisTxt,ym):ONGLET==='notes'?vueNotes():vueVotes();
  if(ONGLET==='pointage')brancherSignalement();
  if(ONGLET==='notes')marquerLues();
}
function setOnglet(o){ONGLET=o;render()}

function vuePointage(moisTxt,ym){
  const s=summary();
  const curYm=DATA.today.slice(0,7),prevYm=shiftYm(curYm,-1);
  const rows=s.lines.slice().reverse().map(l=>{
    const w=new Date(l.ds+'T12:00').getDay();
    const showT=['present','late','autorisation','ferieTravaille','reposTravaille'].includes(l.m.statut);
    return '<tr'+(l.m.ferie?' class="f"':'')+'>'+
      '<td class="mono">'+pad(l.d)+'/'+ym[1]+' <span class="muted">'+JJ[w]+'</span></td>'+
      '<td><span class="tag '+C.statutClass(l.m.statut)+'">'+esc(C.statutLabel(l.m.statut,DATA.sexe))+'</span>'+
        (l.m.revue?' <span class="tag t-late" title="Pointage incomplet">⚠</span>':'')+'</td>'+
      '<td class="mono">'+(showT?esc(aff(l.rec,0)||'—'):'—')+'</td>'+
      '<td class="mono">'+(showT?esc(aff(l.rec,1)||'—'):'—')+'</td>'+
      '<td class="mono">'+(l.m.heures?hLabel(l.m.heures):'—')+'</td>'+
      '<td class="mono">'+(l.m.retard?'+'+l.m.retard:'—')+'</td>'+
      '<td class="mono">'+(l.m.hs?hLabel(l.m.hs):'—')+'</td></tr>';
  }).join('');
  return '<div class="seg">'+
      '<button class="'+(DATA.mois===curYm?'on':'')+'" onclick="loadMonth(\''+curYm+'\')">Ce mois</button>'+
      '<button class="'+(DATA.mois===prevYm?'on':'')+'" onclick="loadMonth(\''+prevYm+'\')">Mois précédent</button>'+
    '</div>'+
    '<div class="card"><h2>'+esc(moisTxt)+'</h2>'+
      '<div class="kpis">'+
        '<div class="kpi good"><div class="v">'+s.trav+'</div><div class="l">Jours travaillés</div></div>'+
        '<div class="kpi '+(s.retN?'warn':'')+'"><div class="v">'+s.retN+'</div><div class="l">Retards ('+s.retMin+' min)</div></div>'+
        '<div class="kpi '+(s.abs?'bad':'')+'"><div class="v">'+s.abs+'</div><div class="l">Absences</div></div>'+
        '<div class="kpi"><div class="v">'+fr2(hDec(s.hN+s.hS))+'<span style="font-size:13px"> h</span></div>'+
          '<div class="l">Heures du mois'+(s.hS?' (dont '+fr2(hDec(s.hS))+' h sup.)':'')+'</div></div>'+
      '</div>'+
      (s.feries?'<div class="note">'+s.feries+' jour(s) férié(s) ce mois — ils ne comptent pas comme des absences.</div>':'')+
      (s.revue?'<div class="err" style="margin-top:12px">'+s.revue+' journée(s) ont un pointage incomplet '+
        '(une entrée ou une sortie manque). Les heures affichées sont provisoires — signalez-le ci-dessous.</div>':'')+
    '</div>'+
    '<div class="card"><h2>Congés — période du '+fmtPer(DATA.conges.du)+' au '+fmtPer(DATA.conges.au)+'</h2>'+
      '<div class="kpis">'+
        '<div class="kpi"><div class="v">'+fr2(hDec(s.hCumul))+'<span style="font-size:13px"> h</span></div>'+
          '<div class="l">Heures travaillées cumulées</div></div>'+
        '<div class="kpi good"><div class="v">'+fr2(hDec(s.hDues))+'<span style="font-size:13px"> h</span></div>'+
          '<div class="l">Heures de congé dues'+(s.coef?' (coef. '+s.coef+')':'')+'</div></div>'+
        '<div class="kpi"><div class="v">'+s.congeAn+'<span style="font-size:13px"> j</span></div>'+
          '<div class="l">Jours de congé déjà pris</div></div>'+
      '</div></div>'+
    '<div class="card"><h2>Détail jour par jour</h2>'+
      '<div style="overflow-x:auto"><table><thead><tr><th>Date</th><th>Statut</th><th>Entrée</th><th>Sortie</th>'+
      '<th>Heures</th><th>Retard</th><th>H.sup</th></tr></thead><tbody>'+
      (rows||'<tr><td colspan="7" class="center muted">Aucun pointage ce mois-ci</td></tr>')+'</tbody></table></div>'+
      '<div class="note">Heures comptées selon l’horaire de l’usine. L’avance avant l’heure de début n’est pas comptée ; '+
      'les heures supplémentaires sont calculées au-delà de l’heure de fin. Les jours fériés et de repos travaillés '+
      'sont comptés entièrement en heures supplémentaires.</div></div>'+
    '<div class="card"><h2>Une erreur dans votre pointage ?</h2>'+
      '<label for="fday" class="muted" style="font-size:12px">Jour concerné</label>'+
      '<select id="fday"><option value="">Choisir le jour…</option>'+
      s.lines.slice().reverse().map(l=>'<option value="'+l.ds+'">'+pad(l.d)+'/'+ym[1]+' '+
        JJ[new Date(l.ds+'T12:00').getDay()]+' — '+esc(C.statutLabel(l.m.statut,DATA.sexe))+'</option>').join('')+'</select>'+
      '<label for="fmsg" class="muted" style="font-size:12px;display:block;margin-top:10px">Ce qui s’est passé</label>'+
      '<textarea id="fmsg" rows="3" placeholder="ex. j’étais présente mais je suis marquée absente"></textarea>'+
      '<button class="btn btn-ghost" id="fsend">Signaler au service RH</button>'+
      '<div class="note">Votre signalement est transmis au service RH avec votre nom. '+
      'Il ne modifie pas automatiquement le pointage.</div></div>';
}
function brancherSignalement(){
  const b=document.getElementById('fsend');if(!b)return;
  b.onclick=async()=>{
    const date=document.getElementById('fday').value;
    const message=document.getElementById('fmsg').value.trim();
    if(!message){toast('Décrivez le problème');return}
    b.disabled=true;b.textContent='Envoi…';
    try{await post('/api/me/flag',{date,message});
      toast('Signalement envoyé au service RH');
      document.getElementById('fmsg').value='';
    }catch(e){toast(lisible(e))}
    b.disabled=false;b.textContent='Signaler au service RH';
  };
}

/* -------------------------------------------------------------------- notes */
function vueNotes(){
  const notes=DATA.notes||[];
  if(!notes.length)return '<div class="card center muted" style="padding:34px 18px">Aucune note de service pour le moment.</div>';
  return notes.map(n=>'<div class="note-item'+(n.lu?'':' nouv')+'">'+
    '<div class="t">'+esc(n.titre)+(n.important?' <span class="tag t-absent">important</span>':'')+
      (n.lu?'':' <span class="tag t-leave">nouveau</span>')+'</div>'+
    '<div class="m">'+esc(String(n.ts||'').replace('T',' ').slice(0,16))+
      (n.par?' · '+esc(n.par):'')+'</div>'+
    '<div class="x">'+esc(n.texte)+'</div></div>').join('');
}
async function marquerLues(){
  const nouv=(DATA.notes||[]).filter(n=>!n.lu);
  for(const n of nouv){
    try{await post('/api/me/lu',{id:n.id});n.lu=true}catch(e){}
  }
  if(nouv.length){
    const seg=document.querySelectorAll('.seg button');
    if(seg.length>1)seg[1].innerHTML='Notes';
  }
}

/* ------------------------------------------------------------------ sondages */
function vueVotes(){
  const votes=DATA.votes||[];
  if(!votes.length)return '<div class="card center muted" style="padding:34px 18px">Aucun sondage en cours.</div>';
  return votes.map(v=>{
    const tot=(v.resultats||[]).reduce((s,x)=>s+x,0);
    const montre=v.vote||v.ferme;
    return '<div class="card"><h2>'+esc(v.question)+'</h2>'+
      (v.ferme?'<div class="note" style="margin-top:-6px;margin-bottom:10px">Sondage clos</div>':'')+
      (v.options||[]).map((o,i)=>{
        if(montre){
          const n=(v.resultats||[])[i]||0;const p=tot?Math.round(n/tot*100):0;
          return '<div class="vote-opt'+(v.monChoix===i?' mien':'')+'" style="cursor:default">'+
            '<div style="display:flex;justify-content:space-between"><span>'+esc(o)+'</span><b>'+p+'%</b></div>'+
            '<div class="bar"><i style="width:'+p+'%"></i></div></div>';
        }
        return '<button class="vote-opt" onclick="voter(\''+esc(v.id)+'\','+i+')">'+esc(o)+'</button>';
      }).join('')+
      (montre?'<div class="note">'+tot+' réponse(s)'+(v.vote?' · vous avez répondu':'')+'</div>'
        :'<div class="note">Choisissez une réponse. Vous ne pourrez pas la modifier.</div>')+
      '</div>';
  }).join('');
}
async function voter(id,choix){
  const v=(DATA.votes||[]).find(x=>x.id===id);if(!v)return;
  if(!confirm('Confirmer votre réponse : « '+v.options[choix]+' » ?\n\nElle ne pourra pas être modifiée.'))return;
  try{
    const d=await post('/api/me/vote',{id,choix});
    v.vote=true;v.resultats=d.resultats;v.monChoix=choix;
    render();toast('Merci, votre réponse est enregistrée');
  }catch(e){toast(lisible(e));}
}

/* ------------------------------------------------------------- installation */
let promptInstall=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();promptInstall=e;
  try{ if(localStorage.getItem('pilotrh_noinstall'))return; }catch(x){}
  document.getElementById('install').classList.add('on');
});
document.getElementById('btnInstall').onclick=async()=>{
  document.getElementById('install').classList.remove('on');
  if(promptInstall){promptInstall.prompt();promptInstall=null}
};
document.getElementById('btnInstallX').onclick=()=>{
  document.getElementById('install').classList.remove('on');
  try{localStorage.setItem('pilotrh_noinstall','1')}catch(e){}
};
/* Le service worker est enregistré depuis la RACINE : déposé sous /assets/, sa
   portée se limitait à /assets/ et il n'interceptait donc jamais /moi — ni
   démarrage hors ligne, ni installation proposée de façon fiable. On supprime
   au passage l'ancien enregistrement resté sur les téléphones déjà équipés. */
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(rs=>{
    rs.forEach(r=>{ if(r.scope.indexOf('/assets/')>=0) r.unregister().catch(()=>{}) });
  }).catch(()=>{});
  navigator.serviceWorker.register('/sw.js',{scope:'/'}).catch(()=>{
    /* repli pour les serveurs anciens qui ne servent pas encore /sw.js */
    navigator.serviceWorker.register('/assets/sw.js').catch(()=>{});
  });
}

/* ------------------------------------------------------- réseau intermittent */
/* Dans l'atelier, le réseau tombe régulièrement. Plutôt qu'un message d'erreur
   sec, on signale l'état et on recharge tout seul dès que la connexion revient. */
const banHors=document.getElementById('hors');
function majReseau(){
  banHors.classList.toggle('on', navigator.onLine===false);
}
window.addEventListener('online',()=>{
  majReseau();
  /* si la première ouverture avait échoué, on retente ; sinon on rafraîchit le mois */
  if(DATA) loadMonth(DATA.mois); else init();
});
window.addEventListener('offline',majReseau);

/* iOS ne déclenche jamais beforeinstallprompt : on explique le geste à faire,
   au lieu de laisser croire que l'installation n'existe pas sur iPhone. */
function aideInstalliOS(){
  const iOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  const deja=window.navigator.standalone===true||
             (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);
  if(!iOS||deja)return;
  try{ if(localStorage.getItem('pilotrh_noinstall'))return; }catch(x){}
  const t=document.getElementById('installTxt');
  if(t)t.textContent='Sur iPhone : bouton Partager, puis « Sur l’écran d’accueil ».';
  const b=document.getElementById('btnInstall');
  if(b)b.style.display='none';
  document.getElementById('install').classList.add('on');
}

Object.assign(window,{loadMonth,setOnglet,voter});

async function init(){
  if(!TOKEN){
    app.innerHTML='<div class="card err">Lien invalide. Scannez votre QR code personnel, '+
      'ou demandez-le au service RH.</div>';
    return;
  }
  const res=await fetchMe('');
  if(res.ok){DATA=res.data;DATA.settings=C.normalizeSettings(DATA.settings);ENGINE.invalidate();render()}
  else if(res.need_pin)pinScreen('');
  else if(res.status===429)pinScreen('Trop de tentatives. Patientez quelques minutes.');
  else{
    try{localStorage.removeItem('pilotrh_t')}catch(e){}
    app.innerHTML='<div class="card err">Lien invalide ou expiré. Demandez un nouveau QR code au service RH.</div>';
  }
}
majReseau();
aideInstalliOS();
init();
</script>

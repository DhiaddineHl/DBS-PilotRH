; PilotRH - configuration de l'agent de la pointeuse
; Ce fichier est normalement fourni DEJA REMPLI dans le kit telecharge depuis
; PilotRH (Securite & acces -> Pointeuse -> Telecharger le kit de l'agent).

[pilotrh]
url = https://VOTRE-APP.up.railway.app
cle =

[pointeuse]
; methode = auto      : la pointeuse ET le fichier attBackup.mdb du logiciel ZKTeco
;                       s'il est sur ce PC (recommande : les envois s'additionnent)
; methode = pointeuse_seule / fichier : une seule source
methode = auto
; Laissez ces lignes vides : l'adresse de la pointeuse se regle dans PilotRH.
; Ne les remplissez que pour forcer une valeur differente sur ce PC.
ip =
port =
motdepasse =
intervalle_min =
; Vide : l'agent cherche lui-meme attBackup.mdb sur ce PC.
fichier_mdb =

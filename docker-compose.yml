services:
  pilotrh:
    build: .
    # Publié sur la boucle locale : mettez un reverse-proxy TLS devant plutôt
    # que d'exposer le port sur toutes les interfaces du réseau de l'usine.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - pilotrh_data:/app/data          # base, photos, documents ET sauvegardes
    environment:
      TZ: Africa/Tunis
      PILOTRH_DATA: /app/data
      # OBLIGATOIRE au premier démarrage, sinon un mot de passe aléatoire est
      # généré et affiché une seule fois dans les journaux.
      PILOTRH_ADMIN_PASSWORD: ${PILOTRH_ADMIN_PASSWORD:?definissez PILOTRH_ADMIN_PASSWORD}
      # Recommandé : sort la clé de signature des sessions de la base.
      PILOTRH_SESSION_SECRET: ${PILOTRH_SESSION_SECRET:-}
      PILOTRH_PUBLIC_URL: ${PILOTRH_PUBLIC_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PILOTRH_MDB_PATH: ${PILOTRH_MDB_PATH:-}
      PILOTRH_SYNC_MINUTES: ${PILOTRH_SYNC_MINUTES:-60}
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
volumes:
  pilotrh_data:
